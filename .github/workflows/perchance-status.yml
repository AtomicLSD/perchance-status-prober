wetDark = smoothstep(0.1, 0.9, wetZone); float wetSheen = pow(wetDark, 2.2) * (noonWeight * 0.35 + dawnWeight * 0.2 + duskWeight * 0.2) * (1.0 - grain * 0.5); vec3 wetSandColor = mix(sandColor, sandColor * 0.58, wetDark); wetSandColor += vec3(0.25, 0.22, 0.18) * wetSheen; float dryDepth = smoothstep(0.55, 1.0, vBeachUv.y) * 0.08; wetSandColor -= vec3(dryDepth); vec3 grainedSand = wetSandColor * (0.88 + grain * 0.24); grainedSand *= (1.0 - rippleContrib); float depthDarken = smoothstep(0.0, 1.0, vBeachUv.y) * 0.22; grainedSand *= (1.0 - depthDarken); grainedSand = mix(grainedSand, grainedSand * vec3(0.90, 0.93, 1.05), depthDarken * 0.5); vec3 fogColor = vec3(0.68, 0.78, 0.88) * (noonWeight + dawnWeight*0.6 + duskWeight*0.4 + midnightWeight*0.15); float fogFactor = smoothstep(0.5, 9.5, gl_FragCoord.w * 80.0); gl_FragColor = vec4(mix(grainedSand, fogColor, fogFactor * 0.35), 1.0); }";

    let beachGeo = new THREE.PlaneGeometry(80, 28, 70, 70);
    beachMat = new THREE.ShaderMaterial({
      vertexShader: beachVertexShader,
      fragmentShader: beachFragmentShader,
      uniforms: { uTime: { value: 0 }, uDayCycle: { value: 0 } },
