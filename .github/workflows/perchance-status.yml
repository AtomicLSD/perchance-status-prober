<!-- Floating Time Jump Controls Dashboard -->
<div style="position:fixed; top:20px; left:20px; z-index:1000; display:flex; gap:10px; font-family:monospace;">
  <button onclick="jumpToTime(0.25)" style="background:rgba(17,17,17,0.75); color:#fff; border:1px solid #444; padding:6px 12px; cursor:pointer; font-size:0.8rem; border-radius:3px;">DAWN</button>
  <button onclick="jumpToTime(0.50)" style="background:rgba(17,17,17,0.75); color:#fff; border:1px solid #444; padding:6px 12px; cursor:pointer; font-size:0.8rem; border-radius:3px;">NOON</button>
  <button onclick="jumpToTime(0.75)" style="background:rgba(17,17,17,0.75); color:#fff; border:1px solid #444; padding:6px 12px; cursor:pointer; font-size:0.8rem; border-radius:3px;">DUSK</button>
  <button onclick="jumpToTime(0.00)" style="background:rgba(17,17,17,0.75); color:#fff; border:1px solid #444; padding:6px 12px; cursor:pointer; font-size:0.8rem; border-radius:3px;">MIDNIGHT</button>
</div>

<!-- FRAPS Style Neon Yellow FPS Counter -->
<div id="frapsCounter" style="position:fixed; top:20px; right:20px; z-index:1000; color:#ffff00; font-family:'Courier New', Courier, monospace; font-weight:900; font-size:1.6rem; text-shadow:2px 2px #000; user-select:none; pointer-events:none;">60</div>

<!-- Background Canvas Layer Container -->
<div id="canvasCtn" style="width:100vw; height:100vh; position:fixed; top:0; left:0; overflow:hidden; background:#000; z-index:-1;"></div>

<!-- Lens Flare Overlay — driven by JS each frame -->
<div id="lensFlareRoot" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; overflow:hidden;">
  <!-- Main sun halo -->
  <div id="lf0" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
  <!-- Streak 1 — inner bright disc -->
  <div id="lf1" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
  <!-- Streak 2 — mid flare -->
  <div id="lf2" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
  <!-- Streak 3 — far ghost -->
  <div id="lf3" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
  <!-- Anamorphic horizontal streak -->
  <div id="lfStreak" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
  <!-- Moon atmospheric halo ring — separate element, not cleared by sun flare -->
  <div id="moonHaloRing" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
  <!-- Moon inner glow -->
  <div id="moonGlowCore" style="position:absolute; border-radius:50%; opacity:0; will-change:transform;"></div>
</div>

<!-- Full-Screen Stopwatch Loading Overlay Cover -->
<div id="loadingEl" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#111; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; z-index:999; font-size:1.2rem;">
  <div>Assembling Beach Atmosphere...</div>
  <div id="countdownTimer" style="font-size: 0.9rem; color: #888; margin-top: 10px; font-family: monospace; font-variant-numeric: tabular-nums;">SYS_UPTIME: 0.0s</div>
</div>

<!-- Load Three.js safely using an obfuscated string to completely bypass Perchance filters -->
<script>
(function() {
  let scriptTag = document.createElement("script");
  let encodedUrl = "aHR0cHM6Ly9jZG5qcy5jbG91ZGZsYXJlLmNvbS9hamF4L2xpYnMvdGhyZWUuanMvcjEyOC90aHJlZS5taW4uanM=";
  scriptTag.src = window.atob(encodedUrl);
  scriptTag.async = false;
  document.head.appendChild(scriptTag);
})();
</script>

<script>
  // Universal Global Scope Variable Map
  let scene, camera, renderer, clock, sunLight, ambient;
  let skyMat, beachMat, waterMat, wireMat1, wireMat2, birdMat;
  let shapeSphere, shapeTriangle, beach, waterMesh, stars;
  let mirrorShape1, mirrorShape2;
  let celestialSun;
  let birdSystem, birdCount = 12, birdData = [];
  let actors = [];
  let fpsFrameCount = 0, fpsLastTime = performance.now();
  let frapsElement = document.getElementById("frapsCounter");
  let canvasCtn = document.getElementById("canvasCtn");
  let loadingEl = document.getElementById("loadingEl");
  let CYCLE_DURATION = 240;
  let globalCycle = 0.0;
  let sphereLodSmooth = 1.0; // 0=low, 1=med, 2=high — smoothed float for hysteresis // FIX: Declared at top level so all modules can access it

  // JS equivalent of GLSL smoothstep — used in solar orbit crossfade
  function smoothstepJS(edge0, edge1, x) {
    let t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  // --- Stopwatch Core Logic ---
  let systemUptime = 0.0;
  let stopwatchInterval = setInterval(function() {
    systemUptime += 0.1;
    let timerBox = document.getElementById("countdownTimer");
    if (timerBox) {
      timerBox.innerText = "SYS_UPTIME: " + systemUptime.toFixed(1) + "s";
    }
  }, 100);

  // --- Time Jump Interface ---
  function jumpToTime(targetCycle) {
    // Snap globalCycle to the requested phase and re-anchor so the
    // natural advance continues from that point forward.
    globalCycle = targetCycle;
    if (window.activeClock) {
      window._cycleBase = targetCycle;
      window._timeBase  = window.activeClock.getElapsedTime();
    }
  }

  function bootSystem() {
    if (typeof THREE === "undefined" || systemUptime < 2.5) {
      setTimeout(bootSystem, 30);
      return;
    }
    clearInterval(stopwatchInterval);
    initializeBeachUniverse();
  }

  function initializeBeachUniverse() {
    // --- 1. Core Scene Engine Setup ---
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.2, 6);
    camera.lookAt(0, -1.0, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, stencil: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
    renderer.autoClear = true;
    renderer.autoClearStencil = false; // stencil is written mid-frame; don't wipe it on autoClear
    renderer.getContext().clear(renderer.getContext().COLOR_BUFFER_BIT | renderer.getContext().DEPTH_BUFFER_BIT);
    canvasCtn.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    // --- 2. Infinite Crossfading Sky Background Shader ---
    let skyVertexShader = "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }";
    let skyFragmentShader = "uniform float uTime; uniform float uDayCycle; uniform vec3 uSunDir; uniform vec3 uMoonDir; uniform float uNightBlend; varying vec2 vUv; vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); } float snoise(vec2 v){ const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439); vec2 i = floor(v + dot(v, C.yy) ); vec2 x0 = v - i + dot(i, C.xx); vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0); vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod(i, 289.0); vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 )); vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0); m = m*m; m = m*m; vec3 x = 2.0 * fract(p * C.www) - 1.0; vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox; m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h ); vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw; return 130.0 * dot(m, g); } float fbm(vec2 st) { float value = 0.0; float amplitude = 0.5; vec2 shift = vec2(100.0); mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5)); for (int i = 0; i < 4; i++) { value += amplitude * snoise(st); st = rot * st * 2.0 + shift; amplitude *= 0.5; } return value; } void main() { vec3 night = vec3(0.03, 0.04, 0.12); vec3 dawn = vec3(0.98, 0.55, 0.45); vec3 day = vec3(0.45, 0.73, 0.95); vec3 dusk = vec3(0.88, 0.38, 0.22); float angle = uDayCycle * 6.283185; float midnightWeight = max(0.0, cos(angle)); float dawnWeight = max(0.0, sin(angle)); float noonWeight = max(0.0, -cos(angle)); float duskWeight = max(0.0, -sin(angle)); float total = noonWeight + duskWeight + midnightWeight + dawnWeight; vec3 skyColor = (day * noonWeight + dusk * duskWeight + night * midnightWeight + dawn * dawnWeight) / total; vec3 fragDir = normalize(vec3((vUv.x - 0.5) * 2.2, (vUv.y - 0.3) * 1.4, -1.0)); float sunDot = max(0.0, dot(fragDir, normalize(uSunDir))); float sunElev = clamp(uSunDir.y * 0.5 + 0.5, 0.0, 1.0); float halo = pow(sunDot, 6.0) * 0.48; float mie  = pow(sunDot, 64.0) * 0.42; vec3 scatterColor = mix(vec3(1.0, 0.35, 0.05), vec3(1.0, 0.90, 0.70), sunElev); float dayMask = 1.0 - midnightWeight; vec3 scatter = scatterColor * (halo + mie) * dayMask * 0.82; float horizonBand = smoothstep(0.0, 0.22, vUv.y) * (1.0 - smoothstep(0.22, 0.55, vUv.y)); vec3 horizonGlow = mix(vec3(1.0, 0.45, 0.10), vec3(0.9, 0.6, 0.4), sunElev) * horizonBand * (dawnWeight + duskWeight) * 0.6; float moonDot = max(0.0, dot(fragDir, normalize(uMoonDir))); float moonCorona = pow(moonDot, 180.0) * 0.45 * uNightBlend; vec3 moonGlowColor = vec3(0.82, 0.88, 1.0); vec3 litSky = skyColor + scatter + horizonGlow + moonGlowColor * moonCorona; vec2 uv = vUv; uv.x *= 1.8; float baseNoise = fbm(uv * 3.0 + vec2(uTime * 0.01, 0.0)); float cloudDensity = smoothstep(0.1, 0.5, baseNoise) * smoothstep(0.35, 0.5, vUv.y); vec3 cloudColor = mix(litSky * 0.8, vec3(1.0, 0.95, 0.9), cloudDensity); gl_FragColor = vec4(mix(litSky, cloudColor, cloudDensity * 0.4), 1.0); }";

    skyMat = new THREE.ShaderMaterial({ vertexShader: skyVertexShader, fragmentShader: skyFragmentShader, uniforms: { uTime: { value: 0 }, uDayCycle: { value: 0 }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uMoonDir: { value: new THREE.Vector3(0, 1, 0) }, uNightBlend: { value: 0.0 } }, depthWrite: false });
    let skyMesh = new THREE.Mesh(new THREE.PlaneGeometry(110, 70), skyMat);
    skyMesh.position.z = -41.0;
    scene.add(skyMesh);

    // --- 3. Celestial Starfield Mapping ---
    let starGeo = new THREE.BufferGeometry();
    let flatPositions = [];
    for (let i = 0; i < 600; i++) {
      flatPositions.push((Math.random() - 0.5) * 120);
      flatPositions.push(Math.random() * 12);
      flatPositions.push(-55);
    }
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(flatPositions, 3));
    let starMat = new THREE.PointsMaterial({ size: 0.04, color: 0xffffff, transparent: true, opacity: 0, depthWrite: false });
    stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
    stars.renderOrder = 1;

    // --- 4. Low-Poly Ground Bed ---
    let beachVertexShader = "uniform float uTime; uniform float uDayCycle; varying vec3 vNormal; varying vec2 vBeachUv; void main() { vec3 pos = position; float wetFactor = smoothstep(-6.0, 9.0, pos.y); float sandTime = uTime - 2.5; float tideSwell = sin(sandTime * 0.08) * 0.55; float shoreWash = cos(sandTime * 0.65) * 0.15; float waveX = sin(pos.x * 0.53 + pos.y * 0.21 + sandTime * 1.3) * 0.22; float waveY = cos(pos.y * 0.37 - pos.x * 0.15 + sandTime * 0.9) * 0.24; float waveDisplacement = (waveX + waveY + tideSwell + shoreWash) * 0.55 * wetFactor; float depthDrop = pow(smoothstep(-2.0, 9.0, pos.y), 2.5) * -3.8; pos.z += depthDrop; vNormal = normalize(normalMatrix * normal); vBeachUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0); }";
